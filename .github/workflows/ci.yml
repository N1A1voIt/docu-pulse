name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# Least privilege: the workflow only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vitest 4 requires ^20 || ^22 || >=24.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Frozen install — fails if package.json and the lockfile disagree, so
      # the committed lockfile stays authoritative (F11).
      - name: Install (frozen)
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc` alone fails on a clean checkout: the LayoutProps/PageProps helpers
      # are generated by Next (dev/build/typegen). The script runs `next typegen`
      # first so route types exist before type checking.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docupulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/docupulse
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/docupulse
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install (frozen)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Applies db/migrations to the Postgres service, then runs the suite.
      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
