services:
  db:
    image: postgres:16
    container_name: docupulse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docupulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docupulse"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
